<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Horario Disponible</title>
    <link rel="stylesheet" href="fontawesome-free-7.2.0-web/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .tabs { display:flex; gap:0; margin-top:20px; flex-wrap:wrap; }
        .tab-btn {
            padding:10px 20px;
            background:#0077b6;
            color:white;
            border:none;
            cursor:pointer;
            font-weight:bold;
            font-size:13px;
            border-right:1px solid #023e8a;
            transition:0.2s;
        }
        .tab-btn:first-child { border-radius:10px 0 0 0; }
        .tab-btn:last-child { border-radius:0 10px 0 0; border-right:none; }
        .tab-btn.activo { background:#023e8a; }
        .tab-btn:hover { background:#023e8a; }
        .tab-content {
            border:2px solid #90e0ef;
            border-top:none;
            border-radius:0 0 12px 12px;
            padding:20px;
            background:#f0f9ff;
            display:none;
        }
        .tab-content.activo { display:block; }
        .tab-content h3 { color:#023e8a; margin:0 0 5px 0; }
        .tab-content p { color:#0077b6; margin:0 0 10px 0; font-size:13px; }
        .no-trabaja { color:#555; font-style:italic; }
        .hora-col { display:inline-flex; flex-direction:column; align-items:center; }
        .hora-col .dia-titulo { background:#023e8a; color:white; padding:6px 20px; border-radius:8px 8px 0 0; font-weight:bold; font-size:13px; min-width:150px; text-align:center; }
        .hora-col .horas-lista { border:2px solid #90e0ef; border-top:none; border-radius:0 0 8px 8px; min-width:150px; overflow:hidden; }
        .hora-item { padding:5px 10px; font-size:12px; text-align:center; border-bottom:1px solid #e0f7fa; background:#f0f9ff; color:#aaa; }
        .hora-item.disponible { background:#00b4d8; color:white; font-weight:bold; }
        .hora-item.ocupada { background:#e63946; color:white; font-weight:bold; }
        .leyenda { display:flex; gap:15px; margin-top:15px; font-size:12px; align-items:center; justify-content:center; }
        .leyenda-item { display:flex; align-items:center; gap:5px; }
        .leyenda-color { width:16px; height:16px; border-radius:4px; }
    </style>
</head>

<body class="body-bg body-center">

<div class="container-large">

    <div class="icon"><i class="fa-solid fa-calendar-days"></i></div>
    <h2 class="title">Consultar Horario Disponible</h2>
    <p class="subtitle">Selecciona una fecha para ver la disponibilidad de todos los veterinarios</p>

    <label class="label">Fecha:</label>
    <input type="date" id="inputFecha" class="input" onchange="consultarDisponibilidad()">

    <div class="leyenda">
        <div class="leyenda-item">
            <div class="leyenda-color" style="background:#00b4d8;"></div>
            <span>Disponible</span>
        </div>
        <div class="leyenda-item">
            <div class="leyenda-color" style="background:#e63946;"></div>
            <span>Ocupada</span>
        </div>
        <div class="leyenda-item">
            <div class="leyenda-color" style="background:#f0f9ff; border:1px solid #90e0ef;"></div>
            <span>Fuera de turno</span>
        </div>
    </div>

    <div id="contenido"></div>

</div>

<script>
    var DIAS = ['','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];

    window.onload = function() {
        var hoy = new Date().toISOString().split("T")[0];
        document.getElementById("inputFecha").setAttribute("min", hoy);
    };

    function consultarDisponibilidad() {
        var fechaStr = document.getElementById("inputFecha").value;
        if (!fechaStr) return;

        var fecha = new Date(fechaStr + "T12:00:00");
        var jsDay = fecha.getDay();
        var diaSemana = jsDay === 0 ? 7 : jsDay;
        var nombreDia = DIAS[diaSemana];

        fetch("controlCitas?accion=CargarVeterinarios")
            .then(function(r) { return r.json(); })
            .then(function(vets) {
                if (!vets || vets.length === 0) {
                    document.getElementById("contenido").innerHTML = "<p style='text-align:center; color:#555;'>No hay veterinarios.</p>";
                    return;
                }

                var promesas = vets.map(function(v) {
                    var pHorario = fetch("controlCitas?accion=CargarHorarioVeterinario&idAcceso=" + v[0])
                        .then(function(r) { return r.json(); });
                    var pOcupadas = fetch("controlCitas?accion=HorasOcupadas&idAcceso=" + v[0])
                        .then(function(r) { return r.json(); });
                    return Promise.all([pHorario, pOcupadas]).then(function(res) {
                        return { vet: v, horario: res[0], ocupadas: res[1] };
                    });
                });

                Promise.all(promesas).then(function(resultados) {
                    construirPestanas(resultados, diaSemana, nombreDia, fechaStr);
                });
            });
    }

    function construirPestanas(resultados, diaSemana, nombreDia, fechaStr) {
        var contenido = document.getElementById("contenido");
        var tabsHTML = "<div class='tabs'>";
        var panelsHTML = "";

        resultados.forEach(function(r, idx) {
            var vet = r.vet;
            var activo = idx === 0 ? " activo" : "";

            // Pestaña
            tabsHTML += "<button class='tab-btn" + activo + "' onclick='cambiarTab(" + idx + ")'>" + vet[1] + "</button>";

            // Panel
            panelsHTML += "<div class='tab-content" + activo + "' id='panel-" + idx + "'>";
            panelsHTML += "<h3>" + vet[1] + "</h3>";
            panelsHTML += "<p>" + vet[2] + "</p>";

            // Buscar si trabaja ese día
            var diaHorario = null;
            if (r.horario) {
                for (var i = 0; i < r.horario.length; i++) {
                    if (parseInt(r.horario[i][0]) === diaSemana) {
                        diaHorario = r.horario[i];
                        break;
                    }
                }
            }

            if (!diaHorario) {
                panelsHTML += "<p class='no-trabaja'>No trabaja el " + nombreDia + "</p>";
            } else {
                var hEntrada = parseInt(diaHorario[2].substring(0,2));
                var hSalida  = parseInt(diaHorario[3].substring(0,2));

                var ocupadasSet = {};
                if (r.ocupadas) {
                    r.ocupadas.forEach(function(o) {
                        if (o[0] === fechaStr) {
                            ocupadasSet[parseInt(o[1].substring(0,2))] = true;
                        }
                    });
                }

                panelsHTML += "<div class='hora-col'>";
                panelsHTML += "<div class='dia-titulo'>" + nombreDia + " — " + fechaStr + "</div>";
                panelsHTML += "<div class='horas-lista'>";

                for (var h = 6; h < 22; h++) {
                    var trabajando = (h >= hEntrada && h < hSalida);
                    var ocupada = ocupadasSet[h] === true;
                    var ampm = h >= 12 ? "PM" : "AM";
                    var h12 = h > 12 ? h - 12 : (h === 0 ? 12 : h);
                    var etiq = h12 + ":00 " + ampm;

                    var clase = "hora-item";
                    if (!trabajando) {
                        // fuera de turno, clase base
                    } else if (ocupada) {
                        clase += " ocupada";
                    } else {
                        clase += " disponible";
                    }

                    panelsHTML += "<div class='" + clase + "'>" + etiq + "</div>";
                }

                panelsHTML += "</div></div>";
            }

            panelsHTML += "</div>";
        });

        tabsHTML += "</div>";
        contenido.innerHTML = tabsHTML + panelsHTML;
    }

    function cambiarTab(idx) {
        // Desactivar todas las pestañas y paneles
        var btns = document.querySelectorAll(".tab-btn");
        var panels = document.querySelectorAll(".tab-content");
        for (var i = 0; i < btns.length; i++) {
            btns[i].className = "tab-btn";
            panels[i].className = "tab-content";
        }
        // Activar la seleccionada
        btns[idx].className = "tab-btn activo";
        document.getElementById("panel-" + idx).className = "tab-content activo";
    }
</script>

</body>
</html>
