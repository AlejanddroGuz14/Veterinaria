<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Modifica Datos</title>
    <link rel="stylesheet" href="fontawesome-free-7.2.0-web/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="body-bg body-center">

<div class="container">

    <div class="icon"><i class="fa-solid fa-paw"></i></div>

    <h1 class="title">Modifica Datos</h1>
    <p class="subtitle">Escribe el usuario para comprobar su existencia</p>

    <form action="controlUsuarios" method="post">

        <label class="label">Usuario:</label>
        <input type="text" name="usuario" class="input" required>

        <!-- NO SE TOCA -->
        <input type="hidden" name="opcion" value="BuscaUsuario">

        <!-- BOTÓN -->
        <input type="submit" name="BuscarUsuarioA" value="Buscar Usuario" class="btn btn-primary">

    </form>

</div>

</body>
</html>
