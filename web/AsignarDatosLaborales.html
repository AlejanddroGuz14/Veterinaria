<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Asignar Datos Laborales</title>
    <link rel="stylesheet" href="fontawesome-free-7.2.0-web/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ── Calendario semanal ── */
        #calendarioSemanal {
            display: none;
            margin-top: 20px;
        }

        .semana-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            margin-top: 10px;
        }

        .dia-col {
            border: 2px solid #90e0ef;
            border-radius: 10px;
            overflow: hidden;
            transition: 0.3s;
        }

        .dia-header {
            background: #0077b6;
            color: white;
            text-align: center;
            padding: 8px 4px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            user-select: none;
            transition: 0.2s;
        }

        .dia-header:hover  { background: #023e8a; }
        .dia-header.activo { background: #00b4d8; }

        .dia-horas {
            display: none;
            flex-direction: column;
        }

        .dia-horas.visible { display: flex; }

        .hora-bloque {
            padding: 4px 6px;
            font-size: 11px;
            text-align: center;
            border-top: 1px solid #e0f7fa;
            background: #f0f9ff;
            color: #023e8a;
        }

        .hora-bloque.trabajando {
            background: #00b4d8;
            color: white;
            font-weight: bold;
        }

        .dia-col.seleccionado .dia-header {
            background: #023e8a;
        }

        .dia-col.seleccionado .hora-bloque.trabajando {
            background: #0077b6;
        }

        .leyenda {
            display: flex;
            gap: 15px;
            margin-top: 10px;
            font-size: 12px;
            align-items: center;
        }

        .leyenda-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .leyenda-color {
            width: 16px;
            height: 16px;
            border-radius: 4px;
        }

        #diasSeleccionados {
            margin-top: 10px;
            font-size: 13px;
            color: #023e8a;
            font-weight: bold;
        }
    </style>
</head>

<body class="body-bg body-center">

<div class="container-large">

    <div class="icon"><i class="fa-solid fa-user"></i></div>
    <h2 class="title">Asignar Datos Laborales</h2>
    <p class="subtitle">Ingresa el usuario del empleado y sus datos laborales</p>

    <form action="controlEmpleados" method="post" id="formLaboral">

        <label class="label">Usuario del empleado:</label>
        <select name="usuarioEmpleado" class="select" required>
            <option value="">-- Selecciona un empleado --</option>
        </select>

        <label class="label">Puesto:</label>
        <select name="idPuesto" class="select" required>
            <option value="">-- Selecciona puesto --</option>
        </select>

        <label class="label">Turno:</label>
        <select name="idTurno" id="selTurno" class="select" required onchange="mostrarCalendario(this)">
            <option value="">-- Selecciona turno --</option>
        </select>

        <label class="label">Salario:</label>
        <input type="text" name="salario" class="input" placeholder="Ej. 8500.00" required>

        <label class="label">Fecha de ingreso:</label>
        <div class="calendar-wrapper">
            <input type="date" name="fechaIngreso" required>
        </div>

        <!-- ══════════════════════════════════════════════ -->
        <!-- CALENDARIO SEMANAL (aparece al elegir turno)  -->
        <!-- ══════════════════════════════════════════════ -->
        <div id="calendarioSemanal">

            <hr style="border-color:#90e0ef; margin: 20px 0;">
            <h3 class="title" style="font-size:18px;"><i class="fa-solid fa-calendar-days"></i> Días a Laborar</h3>
            <p class="subtitle">Haz clic en el nombre del día para seleccionarlo/deseleccionarlo</p>

            <div class="semana-grid" id="semanaGrid"></div>

            <div class="leyenda">
                <div class="leyenda-item">
                    <div class="leyenda-color" style="background:#00b4d8;"></div>
                    <span>Horas de trabajo</span>
                </div>
                <div class="leyenda-item">
                    <div class="leyenda-color" style="background:#f0f9ff; border:1px solid #90e0ef;"></div>
                    <span>Fuera de turno</span>
                </div>
            </div>

            <div id="diasSeleccionados">Días seleccionados: ninguno</div>

            <!-- Campos ocultos que se llenan con JS -->
            <input type="hidden" name="diasLaborales" id="diasLaborales">
            <input type="hidden" name="horaEntradaTurno" id="horaEntradaTurno">
            <input type="hidden" name="horaSalidaTurno"  id="horaSalidaTurno">

        </div>
        <!-- FIN CALENDARIO SEMANAL -->

        <br>
        <input type="submit" name="AsignarDatosLaboralesA" value="Asignar" class="btn btn-primary">

    </form>

</div>

<script>
    // ── Datos de turnos cargados desde el servidor ──
    const turnosData = {};   // { idTurno: { nombre, entrada, salida } }

    const DIAS = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
    let diasActivos = new Set();  // días seleccionados (1-7)

    // ── Carga inicial ──
    window.onload = function () {
        cargarPuestos();
        cargarTurnos();
        cargarEmpleados();
    };

    function cargarEmpleados() {
        fetch("controlEmpleados?accion=CargarEmpleadosYAdmins")
            .then(function(r) { return r.json(); })
            .then(function(data) {
                var sel = document.querySelector("select[name='usuarioEmpleado']");
                data.forEach(function(e) {
                    var opt = document.createElement("option");
                    opt.value = e[0];
                    var tipo = e[2] === "A" ? "Admin" : "Empleado";
                    opt.text  = e[1] + " (" + tipo + ") — " + e[0];
                    opt.dataset.tipo = e[2];
                    sel.appendChild(opt);
                });
                sel.addEventListener("change", filtrarPuestos);
            });
    }

    function cargarPuestos() {
        fetch("controlEmpleados?accion=CargarPuestos")
            .then(r => r.json())
            .then(data => {
                window.todosPuestos = data;
                filtrarPuestos();
            });
    }

    function filtrarPuestos() {
        const selEmp = document.querySelector("select[name='usuarioEmpleado']");
        const selPuesto = document.querySelector("select[name='idPuesto']");
        const opt = selEmp.options[selEmp.selectedIndex];
        const tipo = opt ? opt.dataset.tipo : "";

        selPuesto.innerHTML = "<option value=''>-- Selecciona puesto --</option>";
        if (!window.todosPuestos) return;

        window.todosPuestos.forEach(function(p) {
            var nombre = p[1].toLowerCase();
            var mostrar = false;
            if (tipo === "E" && nombre.indexOf("veterinario") !== -1) mostrar = true;
            if (tipo === "A" && nombre.indexOf("secretaria") !== -1) mostrar = true;
            if (!tipo) mostrar = true;
            if (mostrar) {
                var option = document.createElement("option");
                option.value = p[0];
                option.text = p[1];
                selPuesto.appendChild(option);
            }
        });
    }

    function cargarTurnos() {
        fetch("controlEmpleados?accion=CargarTurnos")
            .then(r => r.json())
            .then(data => {
                const sel = document.getElementById("selTurno");
                data.forEach(t => {
                    const opt = document.createElement("option");
                    opt.value    = t[0];
                    opt.text     = t[1];
                    opt.dataset.entrada = t[2];   // horaEntrada
                    opt.dataset.salida  = t[3];   // horaSalida
                    sel.appendChild(opt);
                });
            });
    }

    // ── Muestra el calendario semanal al elegir turno ──
    function mostrarCalendario(sel) {
        const opt = sel.options[sel.selectedIndex];
        if (!opt || !opt.dataset.entrada) {
            document.getElementById('calendarioSemanal').style.display = 'none';
            return;
        }

        const entrada = opt.dataset.entrada.substring(0, 5);  // "08:00"
        const salida  = opt.dataset.salida.substring(0, 5);   // "14:00"

        document.getElementById('horaEntradaTurno').value = entrada;
        document.getElementById('horaSalidaTurno').value  = salida;

        diasActivos.clear();
        construirGrid(entrada, salida);
        document.getElementById('calendarioSemanal').style.display = 'block';
        actualizarResumen();
    }

    // ── Construye la grilla de 7 días con bloques hora por hora ──
    function construirGrid(entrada, salida) {
        const grid = document.getElementById('semanaGrid');
        grid.innerHTML = '';

        const hEntrada = parseInt(entrada.split(':')[0]);
        const hSalida  = parseInt(salida.split(':')[0]);

        // Rango completo del día (6am a 10pm para visualización)
        const hInicio = 6;
        const hFin    = 22;

        DIAS.forEach((dia, idx) => {
            const numDia = idx + 1;  // 1=Lunes ... 7=Domingo

            const col = document.createElement('div');
            col.className = 'dia-col';
            col.id = 'dia-' + numDia;

            // Header clickeable
            const header = document.createElement('div');
            header.className = 'dia-header';
            header.textContent = dia;
            header.onclick = () => toggleDia(numDia, hEntrada, hSalida);

            // Contenedor de horas
            const horas = document.createElement('div');
            horas.className = 'dia-horas';
            horas.id = 'horas-' + numDia;

            for (let h = hInicio; h < hFin; h++) {
                const bloque = document.createElement('div');
                bloque.className = 'hora-bloque';
                bloque.id = 'bloque-' + numDia + '-' + h;

                const ampm = h >= 12 ? 'PM' : 'AM';
                const h12  = h > 12 ? h - 12 : (h === 0 ? 12 : h);
                bloque.textContent = h12 + ':00 ' + ampm;

                // Marcar horas del turno
                if (h >= hEntrada && h < hSalida) {
                    bloque.classList.add('trabajando');
                }

                horas.appendChild(bloque);
            }

            col.appendChild(header);
            col.appendChild(horas);
            grid.appendChild(col);
        });
    }

    // ── Selecciona / deselecciona un día ──
    function toggleDia(numDia, hEntrada, hSalida) {
        const col    = document.getElementById('dia-' + numDia);
        const horas  = document.getElementById('horas-' + numDia);
        const header = col.querySelector('.dia-header');

        if (diasActivos.has(numDia)) {
            // Deseleccionar
            diasActivos.delete(numDia);
            col.classList.remove('seleccionado');
            header.classList.remove('activo');
            horas.classList.remove('visible');
        } else {
            // Seleccionar
            diasActivos.add(numDia);
            col.classList.add('seleccionado');
            header.classList.add('activo');
            horas.classList.add('visible');
        }

        actualizarResumen();
    }

    // ── Actualiza el resumen de días y el campo oculto ──
    function actualizarResumen() {
        const nombres = [...diasActivos].sort().map(d => DIAS[d - 1]);
        const resumen = document.getElementById('diasSeleccionados');

        if (diasActivos.size === 0) {
            resumen.textContent = 'Días seleccionados: ninguno';
        } else {
            resumen.textContent = 'Días seleccionados: ' + nombres.join(', ');
        }

        // Guardar en campo oculto como "1,2,3,4,5"
        document.getElementById('diasLaborales').value = [...diasActivos].sort().join(',');
    }

    // ── Validar antes de enviar ──
    document.getElementById('formLaboral').addEventListener('submit', function(e) {
        const dias = document.getElementById('diasLaborales').value;
        const turno = document.getElementById('selTurno').value;

        if (turno && (!dias || dias.trim() === '')) {
            e.preventDefault();
            alert('Debes seleccionar al menos un día de trabajo en el calendario.');
        }
    });
</script>

</body>
</html>
