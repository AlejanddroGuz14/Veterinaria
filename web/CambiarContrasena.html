<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cambiar Contraseña</title>
    <link rel="stylesheet" href="fontawesome-free-7.2.0-web/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="body-bg body-center">

<div class="container">

    <div class="icon"><i class="fa-solid fa-key"></i></div>
    <h1 class="title">Cambiar Contraseña</h1>
    <p class="subtitle">Ingresa el usuario para generar nuevas credenciales</p>

    <form action="controlUsuarios" method="post">

        <label class="label">Usuario:</label>
        <input type="text" name="usuario" class="input" placeholder="Usuario actual" required>

        <input type="submit" name="CambiarContrasenaA" value="Generar nueva contraseña" class="btn btn-primary">

    </form>

</div>

</body>
</html>
